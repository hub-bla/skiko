name: Skiko Test Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to write into produced Maven artifacts'
        required: true
        default: '0.0.0-test'
      release:
        description: 'Produce a non-SNAPSHOT release version'
        required: true
        type: boolean
        default: false

jobs:
  Android:
    name: 'Android Artifacts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish to Build Repo'
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ inputs.version }} \
              -Pdeploy.release=${{ inputs.release }} \
              -Pskiko.android.enabled=true \
              :skiko:publishToBuildRepo

      - uses: actions/upload-artifact@v4
        name: 'Upload Android Maven Repo'
        with:
          name: skiko-test-release-android
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 14

  Web:
    name: 'Web Artifacts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish to Build Repo'
        with:
          image_name: linux-emscripten-amd64
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ inputs.version }} \
              -Pdeploy.release=${{ inputs.release }} \
              -Pskiko.wasm.enabled=true \
              :skiko:publishToBuildRepo

      - uses: actions/upload-artifact@v4
        name: 'Upload Web Maven Repo'
        with:
          name: skiko-test-release-web
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 14

  Linux:
    name: 'Linux Artifacts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish KMP and AWT to Build Repo'
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ inputs.version }} \
              -Pdeploy.release=${{ inputs.release }} \
              -Pskiko.native.enabled=true \
              -Pskiko.awt.enabled=true \
              :skiko:publishKotlinMultiplatformPublicationToBuildRepoRepository \
              :skiko:publishAwtPublicationToBuildRepoRepository \
              :skiko:publishAwtRuntimeElementsPublicationToBuildRepoRepository

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Linux Native to Build Repo'
        with:
          image_name: linux-amd64
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pdeploy.version=${{ inputs.version }} \
              -Pdeploy.release=${{ inputs.release }} \
              -Pskiko.native.enabled=true \
              -Pskiko.awt.enabled=false \
              :skiko:publishLinuxArm64PublicationToBuildRepoRepository \
              :skiko:publishLinuxX64PublicationToBuildRepoRepository

      - uses: actions/upload-artifact@v4
        name: 'Upload Linux Maven Repo'
        with:
          name: skiko-test-release-linux
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 14

  macOS:
    name: 'macOS Artifacts'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish to Build Repo'
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pdeploy.version=${{ inputs.version }} \
            -Pdeploy.release=${{ inputs.release }} \
            -Pskiko.native.enabled=true \
            :skiko:publishToBuildRepo

      - uses: actions/upload-artifact@v4
        name: 'Upload macOS Maven Repo'
        with:
          name: skiko-test-release-macos
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 14

  Windows:
    name: 'Windows Artifacts'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: microsoft/setup-msbuild@v1

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish to Build Repo'
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pdeploy.version=${{ inputs.version }} \
            -Pdeploy.release=${{ inputs.release }} \
            -Pskiko.native.enabled=true \
            :skiko:publishToBuildRepo

      - uses: actions/upload-artifact@v4
        name: 'Upload Windows Maven Repo'
        with:
          name: skiko-test-release-windows
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 14
