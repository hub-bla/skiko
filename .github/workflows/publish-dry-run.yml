name: Skiko Publish Dry Run

on:
  workflow_call: # Allow being called by other workflows

jobs:
  Android:
    name: 'Android Publish Dry Run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Maven Local'
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pskiko.android.enabled=true \
              :skiko:publishToMavenLocal \
              :skiko:skiko-skottie:publishToMavenLocal

      - uses: ./.github/actions/docker-skiko-run
        name: 'Check Android Sample'
        with:
          image_name: linux-compat
          working_directory: samples/SkiaAndroidSample
          command: |
            ./gradlew --no-daemon --stacktrace \
              packageRelease

      - uses: actions/upload-artifact@v4
        name: 'Upload Android Maven Repo'
        with:
          name: skiko-publish-dry-run-android
          path: ~/.m2/repository/org/jetbrains/skiko
          if-no-files-found: error
          retention-days: 14

  Web:
    name: 'Web Publish Dry Run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Maven Local'
        with:
          image_name: linux-emscripten-amd64
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pskiko.wasm.enabled=true \
              :skiko:publishToMavenLocal \
              :skiko:skiko-skottie:publishToMavenLocal

      - uses: actions/upload-artifact@v4
        name: 'Upload Web Maven Repo'
        with:
          name: skiko-publish-dry-run-web
          path: ~/.m2/repository/org/jetbrains/skiko
          if-no-files-found: error
          retention-days: 14

  Linux:
    name: 'Linux Publish Dry Run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish KMP and AWT Maven Local'
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pskiko.native.enabled=true \
              -Pskiko.awt.enabled=true \
              :skiko:publishKotlinMultiplatformPublicationToMavenLocal \
              :skiko:publishAwtPublicationToMavenLocal \
              :skiko:publishAwtRuntimeElementsPublicationToMavenLocal \
              :skiko:skiko-skottie:publishKotlinMultiplatformPublicationToMavenLocal \
              :skiko:skiko-skottie:publishAwtPublicationToMavenLocal \
              :skiko:skiko-skottie:publishAwtRuntimeElementsPublicationToMavenLocal

      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Native Maven Local'
        with:
          image_name: linux-amd64
          command: |
            ./gradlew --no-daemon --stacktrace \
              -Pskiko.native.enabled=true \
              -Pskiko.awt.enabled=false \
              :skiko:publishLinuxArm64PublicationToMavenLocal \
              :skiko:publishLinuxX64PublicationToMavenLocal \
              :skiko:skiko-skottie:publishLinuxArm64PublicationToMavenLocal \
              :skiko:skiko-skottie:publishLinuxX64PublicationToMavenLocal

      - uses: ./.github/actions/docker-skiko-run
        name: 'Check AWT Sample'
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace \
              :SkiaAwtSample:installDist

      - uses: actions/upload-artifact@v4
        name: 'Upload Linux Maven Repo'
        with:
          name: skiko-publish-dry-run-linux
          path: ~/.m2/repository/org/jetbrains/skiko
          if-no-files-found: error
          retention-days: 14

  macOS:
    name: 'macOS Publish Dry Run'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish Maven Local'
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pskiko.native.enabled=true \
            :skiko:publishToMavenLocal \
            :skiko:skiko-skottie:publishToMavenLocal

      - shell: bash
        name: 'Check AWT Sample'
        run: |
          ./gradlew --no-daemon --stacktrace \
            :SkiaAwtSample:installDist

      - uses: actions/upload-artifact@v4
        name: 'Upload macOS Maven Repo'
        with:
          name: skiko-publish-dry-run-macos
          path: ~/.m2/repository/org/jetbrains/skiko
          if-no-files-found: error
          retention-days: 14

  Windows:
    name: 'Windows Publish Dry Run'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: microsoft/setup-msbuild@v1

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish Maven Local'
        run: |
          ./gradlew --no-daemon --stacktrace \
            -Pskiko.native.enabled=true \
            :skiko:publishToMavenLocal \
            :skiko:skiko-skottie:publishToMavenLocal

      - shell: bash
        name: 'Check AWT Sample'
        run: |
          ./gradlew --no-daemon --stacktrace \
            :SkiaAwtSample:installDist

      - uses: actions/upload-artifact@v4
        name: 'Upload Windows Maven Repo'
        with:
          name: skiko-publish-dry-run-windows
          path: ~/.m2/repository/org/jetbrains/skiko
          if-no-files-found: error
          retention-days: 14
